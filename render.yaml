services:
  - type: web
    name: courthero-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
